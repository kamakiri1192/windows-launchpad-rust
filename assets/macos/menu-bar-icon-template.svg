<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!--
    2x artwork for the 18pt macOS menu-bar slot.

    The rounded outline preserves the app icon's glass frame, while four solid
    tiles communicate the launcher function at status-bar size. The restrained
    outline weight lets the tiles lead while keeping the frame legible.
  -->
  <rect
    x="3"
    y="3"
    width="30"
    height="30"
    rx="7.5"
    fill="none"
    stroke="black"
    stroke-width="2.5"
  />
  <g fill="black">
    <rect x="8" y="8" width="7.5" height="7.5" rx="2.25"/>
    <rect x="20.5" y="8" width="7.5" height="7.5" rx="2.25"/>
    <rect x="8" y="20.5" width="7.5" height="7.5" rx="2.25"/>
    <rect x="20.5" y="20.5" width="7.5" height="7.5" rx="2.25"/>
  </g>
</svg>
