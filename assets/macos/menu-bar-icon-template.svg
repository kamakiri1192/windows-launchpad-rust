<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!--
    2x artwork for the 18pt macOS menu-bar slot.

    The four transparent windows preserve the app icon's core identity. The
    small central diamond adds a highlight-like signature without relying on
    colour, while the shared outer body keeps the glyph legible at status-bar
    size.
  -->
  <mask id="glyph">
    <rect width="36" height="36" fill="black"/>
    <rect x="2" y="2" width="32" height="32" rx="8" fill="white"/>
    <rect x="6" y="6" width="10" height="10" rx="3.5" fill="black"/>
    <rect x="20" y="6" width="10" height="10" rx="3.5" fill="black"/>
    <rect x="6" y="20" width="10" height="10" rx="3.5" fill="black"/>
    <rect x="20" y="20" width="10" height="10" rx="3.5" fill="black"/>
    <path d="M18 15.5 20.5 18 18 20.5 15.5 18Z" fill="black"/>
  </mask>
  <rect width="36" height="36" fill="black" mask="url(#glyph)"/>
</svg>
