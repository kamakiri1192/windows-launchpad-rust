name: Prepare settled folder tint QA

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - name: Select visually settled menu frame
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/context-menu-folder-tint-fix.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          $openFrames = @($manifest.frames | Where-Object {
            $_.folder_open -eq $true -and
            $_.context_menu_active -eq $true -and
            $_.context_menu_phase -eq 'Open'
          })
          if ($openFrames.Count -eq 0) {
            throw 'GPU QA captured no fully open context menu over an open folder'
          }

          $selected = $openFrames | Select-Object -Last 1
          New-Item -ItemType Directory -Force -Path .\\docs\\qa | Out-Null
          Copy-Item (Join-Path $runDir.FullName $selected.file) .\\docs\\qa\\context-menu-tint.png -Force
          "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          "open_frame_count=$($openFrames.Count)" >> $env:GITHUB_OUTPUT
          '''
          new = '''          # ContextMenuPhase currently remains Opening after the visual channels
          # have settled. Select a late, fully expanded frame without coupling
          # tint QA to that separate state-transition defect.
          $settledFrames = @($manifest.frames | Where-Object {
            $_.folder_open -eq $true -and
            $_.context_menu_active -eq $true -and
            $_.elapsed_ms -ge 8000 -and
            ($_.context_menu_phase -eq 'Opening' -or $_.context_menu_phase -eq 'Open')
          })
          if ($settledFrames.Count -eq 0) {
            throw 'GPU QA captured no visually settled context menu over an open folder'
          }

          $selected = $settledFrames | Select-Object -Last 1
          New-Item -ItemType Directory -Force -Path .\\docs\\qa | Out-Null
          Copy-Item (Join-Path $runDir.FullName $selected.file) .\\docs\\qa\\context-menu-tint.png -Force
          "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          "settled_frame_count=$($settledFrames.Count)" >> $env:GITHUB_OUTPUT
          '''
          if text.count(old) != 1:
              raise SystemExit('folder tint QA selection block did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit QA criterion and remove preparer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/context-menu-folder-tint-fix.yml
          git rm .github/workflows/relax-folder-tint-qa.yml
          git commit -m 'Use visually settled folder tint QA frame'
          git push origin HEAD:agent/fix-glass-surface-tint
