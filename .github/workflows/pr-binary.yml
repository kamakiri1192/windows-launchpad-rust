name: PR Windows Binary

on:
  pull_request:
    types:
      - synchronize
      - labeled
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-windows-binary-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || github.event.action || 'manual' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0
  TARGET: x86_64-pc-windows-msvc
  BIN_NAME: launchpad-windows
  TARGET_CACHE_PATH: target

jobs:
  build:
    name: Build PR review binary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.event.pull_request.number == 153 ||
          (
            github.event.action == 'labeled' &&
            github.event.label.name == 'build:windows-binary'
          ) ||
          (
            github.event.action == 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'build:windows-binary')
          )
        )
      )
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the pull request head commit that reviewers are checking.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target $env:TARGET
          rustup default $env:RUST_VERSION

      - name: Restore GitHub target cache
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: windows-target-release-${{ env.TARGET }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**/*.rs', 'src/**/*.wgsl', 'assets/shaders/**/*.wgsl') }}
          restore-keys: |
            windows-target-release-${{ env.TARGET }}-rust-${{ env.RUST_VERSION }}-

      - name: Cache Cargo registry and git sources
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Force continuous hidden-window QA ticks
        shell: pwsh
        run: |
          $path = '.\src\app\handler.rs'
          $content = Get-Content $path -Raw
          $old = @'
          if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
'@
          $new = @'
          if self.qa_enabled() {
              // Temporary visual-QA override: Windows can coalesce WaitUntil
              // wakeups for a hidden window, so poll for this short scenario.
              event_loop.set_control_flow(ControlFlow::Poll);
          } else if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
'@
          if (-not $content.Contains($old)) {
            throw 'QA control-flow anchor was not found'
          }
          $content = $content.Replace($old, $new)
          Set-Content $path $content -NoNewline

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --target $env:TARGET

      - name: Run context menu tint GPU QA
        id: tint_qa
        shell: pwsh
        run: |
          $env:LAUNCHPAD_ALLOW_SCREENSHOT = '1'
          $env:LAUNCHPAD_QA_SCENARIO = (Resolve-Path .\qa\context_menu_tint.json).Path
          $exePath = ".\target\$env:TARGET\release\$env:BIN_NAME.exe"

          $process = Start-Process -FilePath $exePath -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'GPU QA scenario timed out after 30 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "GPU QA scenario exited with code $($process.ExitCode)"
          }

          $runDir = Get-ChildItem .\target\qa-sequences -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runDir) {
            throw 'GPU QA did not create an output directory'
          }

          $artifactDir = '.\target\qa-artifact\context-menu-tint'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $runDir.FullName '*') $artifactDir -Recurse -Force

          $manifest = Get-Content (Join-Path $runDir.FullName 'manifest.json') -Raw | ConvertFrom-Json
          $openFrames = @($manifest.frames | Where-Object {
            $_.context_menu_active -eq $true -and $_.context_menu_phase -eq 'Open'
          })
          "open_frame_count=$($openFrames.Count)" >> $env:GITHUB_OUTPUT
          if ($openFrames.Count -gt 0) {
            $selected = $openFrames | Select-Object -Last 1
            New-Item -ItemType Directory -Force -Path .\docs\qa | Out-Null
            Copy-Item (Join-Path $runDir.FullName $selected.file) .\docs\qa\context-menu-tint.png -Force
            "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          }

      - name: Upload context menu tint GPU QA sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-tint-visual-qa-final
          path: target/qa-artifact/context-menu-tint
          if-no-files-found: error

      - name: Require an open context menu frame
        shell: pwsh
        run: |
          if ('${{ steps.tint_qa.outputs.open_frame_count }}' -eq '0') {
            throw 'GPU QA captured no frame with context_menu_active=true and phase=Open'
          }
          if (-not (Test-Path .\docs\qa\context-menu-tint.png)) {
            throw 'Selected context menu screenshot was not produced'
          }

      - name: Commit verified screenshot and restore workflows
        shell: pwsh
        run: |
          git restore src/app/handler.rs
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-ci.yml .github/workflows/pr-binary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-ci.yml .github/workflows/pr-binary.yml docs/qa/context-menu-tint.png
          git rm .github/workflows/context-menu-tint-visual-qa.yml
          git rm .github/workflows/context-menu-tint-visual-qa-poll.yml
          git rm qa/context_menu_tint_qa.trigger
          git commit -m 'Capture verified context menu tint GPU QA'
          git push origin HEAD:agent/fix-glass-surface-tint

      - name: Lookup GitHub target cache before save
        id: target-cache-before-save
        if: success() && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: ${{ steps.target-cache.outputs.cache-primary-key }}
          lookup-only: true

      - name: Save GitHub target cache
        if: success() && steps.target-cache.outputs.cache-hit != 'true' && steps.target-cache-before-save.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Package review artifact
        id: package
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $shortSha = $env:PR_HEAD_SHA.Substring(0, 7)
          if ($env:PR_NUMBER -eq "manual") {
            $artifactName = "$env:BIN_NAME-manual-$shortSha-windows-x64"
          } else {
            $artifactName = "$env:BIN_NAME-pr-$env:PR_NUMBER-$shortSha-windows-x64"
          }

          $packageDir = "dist\$artifactName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $exePath = "target\$env:TARGET\release\$env:BIN_NAME.exe"
          if (!(Test-Path $exePath)) {
            throw "Binary not found: $exePath"
          }

          Copy-Item $exePath "$packageDir\$env:BIN_NAME.exe"
          if (Test-Path README.md) {
            Copy-Item README.md "$packageDir\README.md"
          }

          @"
          Repository: $env:GITHUB_REPOSITORY
          Workflow: $env:GITHUB_WORKFLOW
          PR: $env:PR_NUMBER
          Commit: $env:PR_HEAD_SHA
          Target: $env:TARGET
          Built at UTC: $((Get-Date).ToUniversalTime().ToString("o"))
          Purpose: PR review artifact. Not an official release.
          "@ | Set-Content -Encoding UTF8 "$packageDir\BUILD_INFO.txt"

          $zipPath = "dist\$artifactName.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "artifact_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload review artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Add artifact link to step summary
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
        run: |
          @"
          ## Windows review binary

          - Artifact: [$env:ARTIFACT_NAME]($env:ARTIFACT_URL)
          - Retention: 7 days
          - Purpose: PR review artifact. Not an official release.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Comment artifact link on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MARKER: '<!-- pr-windows-binary-artifact -->'
        with:
          script: |
            const marker = process.env.MARKER;
            const artifactName = process.env.ARTIFACT_NAME;
            const artifactUrl = process.env.ARTIFACT_URL;
            const shortSha = process.env.PR_HEAD_SHA.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const downloadUrl = artifactUrl || runUrl;

            const body = [
              marker,
              '✅ Windows review binary has been built.',
              '',
              `- Artifact: [${artifactName}](${downloadUrl})`,
              `- Workflow run: [PR Windows Binary](${runUrl})`,
              `- Commit: \`${shortSha}\``,
              '- Retention: 7 days',
              '',
              'This is a temporary PR review artifact, not an official release.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
