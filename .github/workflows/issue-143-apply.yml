name: Apply Issue 143 Fix

on:
  push:
    branches:
      - agent/fix-glass-surface-tint
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup component add clippy rustfmt --toolchain $env:RUST_VERSION
          rustup default $env:RUST_VERSION

      - name: Assemble and apply patch
        shell: pwsh
        run: |
          Get-Content .github/issue-143-patch.part1, .github/issue-143-patch.part2, .github/issue-143-patch.part3, .github/issue-143-patch.part4 | Set-Content "$env:RUNNER_TEMP/issue-143-patch.py" -Encoding utf8
          python "$env:RUNNER_TEMP/issue-143-patch.py"

      - name: Format
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked

      - name: Remove patch scaffolding
        shell: pwsh
        run: |
          Remove-Item .github/issue-143-patch.part1
          Remove-Item .github/issue-143-patch.part2
          Remove-Item .github/issue-143-patch.part3
          Remove-Item .github/issue-143-patch.part4
          Remove-Item .github/workflows/issue-143-apply.yml

      - name: Commit verified fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix per-surface Liquid Glass tint rendering"
          git push origin HEAD:agent/fix-glass-surface-tint
