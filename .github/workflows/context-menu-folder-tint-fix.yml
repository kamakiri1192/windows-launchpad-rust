name: Context menu tint GPU QA

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.number == 153
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Keep hidden QA window ticking
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/handler.rs")
          text = path.read_text(encoding="utf-8")
          old = """        if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
          """
          new = """        if self.qa_enabled() {
              event_loop.set_control_flow(ControlFlow::Poll);
          } else if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
          """
          if text.count(old) != 1:
              raise SystemExit("hidden-window QA scheduler anchor did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Build debug launcher
        shell: pwsh
        run: cargo build --locked

      - name: Run context-menu GPU QA
        id: qa
        shell: pwsh
        run: |
          $env:LAUNCHPAD_ALLOW_SCREENSHOT = '1'
          $env:LAUNCHPAD_QA_SCENARIO = (Resolve-Path .\qa\context_menu_tint.json).Path

          $process = Start-Process -FilePath .\target\debug\launchpad-windows.exe -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'GPU QA scenario timed out after 60 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "GPU QA scenario exited with code $($process.ExitCode)"
          }

          $runDir = Get-ChildItem .\target\qa-sequences -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runDir) {
            throw 'GPU QA did not create an output directory'
          }

          $manifest = Get-Content (Join-Path $runDir.FullName 'manifest.json') -Raw | ConvertFrom-Json
          $openFrames = @($manifest.frames | Where-Object {
            $_.context_menu_active -eq $true -and $_.context_menu_phase -eq 'Open'
          })
          if ($openFrames.Count -eq 0) {
            throw 'GPU QA captured no fully open context-menu frame'
          }

          $selected = $openFrames | Select-Object -Last 1
          New-Item -ItemType Directory -Force -Path .\docs\qa | Out-Null
          Copy-Item (Join-Path $runDir.FullName $selected.file) .\docs\qa\context-menu-tint.png -Force

          $artifactDir = '.\target\qa-artifact\context-menu-tint'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $runDir.FullName '*') $artifactDir -Recurse -Force

          "open_frame_count=$($openFrames.Count)" >> $env:GITHUB_OUTPUT
          "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          Write-Host "Selected frame: $($selected.file)"
          Write-Host "Fully open frames: $($openFrames.Count)"

      - name: Restore temporary scheduler patch
        if: always()
        shell: pwsh
        run: git restore src/app/handler.rs

      - name: Upload complete GPU QA sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-tint-gpu-qa
          path: target/qa-artifact/context-menu-tint
          if-no-files-found: warn

      - name: Commit verified screenshot and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/context-menu-tint.png qa/context_menu_tint.json
          git rm .github/workflows/context-menu-folder-tint-fix.yml
          git commit -m 'Capture settled context menu tint GPU QA'
          git push origin HEAD:agent/fix-glass-surface-tint
