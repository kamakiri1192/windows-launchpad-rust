name: Fix folder context menu tint ordering

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.number == 153
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2

      - name: Apply draw-order fix and direct-open QA
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          frame_path = Path('src/renderer/frame.rs')
          frame = frame_path.read_text(encoding='utf-8')
          old_glass = re.compile(
              r'(?ms)^        // Context-menu Liquid Glass surface, isolated from the modal lane so it\n'
              r'        // never smooth-unions with an open folder panel\.\n'
              r'        let profile_scope = self\n'
              r'            \.gpu_profiler\n'
              r'            \.begin\("context_menu_liquid_glass", &mut encoder\);\n'
              r'        self\.liquid_glass\n'
              r'            \.render_context_menu_glass\(&self\.queue, &mut encoder, &view\);\n'
              r'        self\.gpu_profiler\.end\(&mut encoder, profile_scope\);\n\n'
          )
          frame, removed = old_glass.subn('', frame, count=1)
          if removed != 1:
              raise SystemExit(f'old context-menu glass pass matches={removed}, expected=1')

          marker = '        // Context-menu content pass: tiles (opaque background), ink (icons),\n'
          if frame.count(marker) != 1:
              raise SystemExit('context-menu content marker did not match exactly once')
          moved_glass = (
              '        // Context-menu glass must sample the complete modal scene. In particular,\n'
              '        // folder child icons are modal content; drawing them after this pass would\n'
              '        // overwrite the menu tint and make the icons appear to punch through.\n'
              '        let profile_scope = self\n'
              '            .gpu_profiler\n'
              '            .begin("context_menu_liquid_glass", &mut encoder);\n'
              '        self.liquid_glass\n'
              '            .render_context_menu_glass(&self.queue, &mut encoder, &view);\n'
              '        self.gpu_profiler.end(&mut encoder, profile_scope);\n\n'
          )
          frame = frame.replace(marker, moved_glass + marker, 1)
          frame_path.write_text(frame, encoding='utf-8')

          qa_path = Path('src/qa.rs')
          qa = qa_path.read_text(encoding='utf-8')
          enum_anchor = '    OpenFolder {\n        id: String,\n    },\n'
          if qa.count(enum_anchor) != 1:
              raise SystemExit('OpenFolder enum anchor did not match exactly once')
          qa = qa.replace(
              enum_anchor,
              enum_anchor
              + '    /// Open a context menu through semantic QA geometry, bypassing native right-click routing.\n'
              + '    OpenContextMenu {\n        target: QaTarget,\n    },\n',
              1,
          )

          match_anchor = (
              '            QaAction::OpenFolder { id } => {\n'
              '                self.open_folder(FolderId::from_normalized(id));\n'
              '            }\n'
          )
          if qa.count(match_anchor) != 1:
              raise SystemExit('OpenFolder match anchor did not match exactly once')
          qa = qa.replace(
              match_anchor,
              match_anchor
              + '            QaAction::OpenContextMenu { target } => {\n'
              + '                let (item, rect) = self\n'
              + '                    .resolve_qa_context_menu_target(&target)\n'
              + '                    .unwrap_or_else(|| panic!("QA context-menu target did not resolve: {target:?}"));\n'
              + '                self.open_context_menu(item, rect);\n'
              + '                // Semantic visual QA captures the settled endpoint rather than\n'
              + '                // depending on the cadence of a hidden native window.\n'
              + '                for _ in 0..600 {\n'
              + '                    if !self.context_menu.tick(1.0 / 60.0) {\n'
              + '                        break;\n'
              + '                    }\n'
              + '                }\n'
              + '            }\n',
              1,
          )

          helper_marker = '    fn resolve_qa_target(&self, target: &QaTarget) -> Option<Point> {\n'
          if qa.count(helper_marker) != 1:
              raise SystemExit('resolve_qa_target marker did not match exactly once')
          helper = (
              '    fn resolve_qa_context_menu_target(\n'
              '        &self,\n'
              '        target: &QaTarget,\n'
              '    ) -> Option<(LauncherItem, crate::ui_model::geometry::Rect)> {\n'
              '        match target {\n'
              '            QaTarget::GridItem { index } | QaTarget::GridItemPoint { index, .. } => {\n'
              '                let item = self.visible_launcher_items().get(*index)?.clone();\n'
              '                let rect = self.launcher_item_rect(&item)?;\n'
              '                Some((item, rect))\n'
              '            }\n'
              '            QaTarget::FolderChild { index } => {\n'
              '                let folder_id = self.folders.active.as_ref()?;\n'
              '                let folder = self.launcher_state.folders.get(folder_id)?;\n'
              '                let app_id = folder.children.get(*index)?.clone();\n'
              '                let rect = *self.folder_layout.as_ref()?.child_rects.get(*index)?;\n'
              '                Some((LauncherItem::App(app_id), rect))\n'
              '            }\n'
              '            _ => None,\n'
              '        }\n'
              '    }\n\n'
          )
          qa = qa.replace(helper_marker, helper + helper_marker, 1)
          qa_path.write_text(qa, encoding='utf-8')

          apps = [
              {'id': f'qa-folder-app-{index}', 'name': f'Folder App {index + 1}'}
              for index in range(9)
          ]
          scenario = {
              'name': 'context-menu-folder-tint',
              'viewport': [1280, 800],
              'fps': 30,
              'duration_ms': 10000,
              'output_dir': 'target/qa-sequences',
              'fixture': {
                  'apps': apps,
                  'folders': [{
                      'id': 'qa-tint-folder',
                      'name': 'Tint QA Folder',
                      'children': [app['id'] for app in apps],
                  }],
                  'items': [{'kind': 'folder', 'id': 'qa-tint-folder'}],
              },
              'actions': [
                  {'at_ms': 0, 'type': 'open_folder', 'id': 'qa-tint-folder'},
                  {
                      'at_ms': 1500,
                      'type': 'open_context_menu',
                      'target': {'kind': 'folder_child', 'index': 0},
                  },
              ],
          }
          Path('qa/context_menu_tint.json').write_text(
              json.dumps(scenario, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Test
        shell: pwsh
        run: cargo test --all-targets --locked

      - name: Keep hidden QA window ticking
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path('src/app/handler.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)if let Some\(deadline\) = self\.qa_next_deadline\(\) \{\n'
              r'(?P=indent)    event_loop\.set_control_flow\(ControlFlow::WaitUntil\(deadline\.max\(now\)\)\);\n'
              r'(?P=indent)\} else \{'
          )
          replacement = (
              r'\g<indent>if self.qa_enabled() {\n'
              r'\g<indent>    event_loop.set_control_flow(ControlFlow::Poll);\n'
              r'\g<indent>} else if let Some(deadline) = self.qa_next_deadline() {\n'
              r'\g<indent>    event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));\n'
              r'\g<indent>} else {'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'hidden-window QA scheduler anchor matched {count} times')
          path.write_text(text, encoding='utf-8')

      - name: Build debug launcher
        shell: pwsh
        run: cargo build --locked

      - name: Run folder context-menu GPU QA
        id: qa
        shell: pwsh
        run: |
          $env:LAUNCHPAD_ALLOW_SCREENSHOT = '1'
          $env:LAUNCHPAD_QA_SCENARIO = (Resolve-Path .\qa\context_menu_tint.json).Path
          $process = Start-Process -FilePath .\target\debug\launchpad-windows.exe -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'GPU QA scenario timed out after 60 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "GPU QA scenario exited with code $($process.ExitCode)"
          }

          $runDir = Get-ChildItem .\target\qa-sequences -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runDir) { throw 'GPU QA did not create an output directory' }

          $artifactDir = '.\target\qa-artifact\context-menu-folder-tint'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $runDir.FullName '*') $artifactDir -Recurse -Force

          $manifest = Get-Content (Join-Path $runDir.FullName 'manifest.json') -Raw | ConvertFrom-Json
          $manifest.frames |
            Select-Object elapsed_ms, folder_open, context_menu_active, context_menu_phase |
            Format-Table -AutoSize | Out-String | Write-Host

          $openFrames = @($manifest.frames | Where-Object {
            $_.folder_open -eq $true -and
            $_.context_menu_active -eq $true -and
            $_.context_menu_phase -eq 'Open'
          })
          if ($openFrames.Count -eq 0) {
            throw 'GPU QA captured no fully open context menu over an open folder'
          }

          $selected = $openFrames | Select-Object -Last 1
          New-Item -ItemType Directory -Force -Path .\docs\qa | Out-Null
          Copy-Item (Join-Path $runDir.FullName $selected.file) .\docs\qa\context-menu-tint.png -Force
          "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          "open_frame_count=$($openFrames.Count)" >> $env:GITHUB_OUTPUT

      - name: Restore temporary scheduler patch
        if: always()
        shell: pwsh
        run: git restore src/app/handler.rs

      - name: Upload complete GPU QA sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-folder-tint-gpu-qa
          path: target/qa-artifact/context-menu-folder-tint
          if-no-files-found: warn

      - name: Commit fix and verified screenshot
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/frame.rs src/qa.rs qa/context_menu_tint.json docs/qa/context-menu-tint.png
          git rm .github/workflows/context-menu-folder-tint-fix.yml
          git commit -m 'Fix context menu glass ordering over folder icons'
          git push origin HEAD:agent/fix-glass-surface-tint
