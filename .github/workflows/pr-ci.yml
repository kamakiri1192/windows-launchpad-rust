name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0
  TARGET: x86_64-pc-windows-msvc
  TARGET_CACHE_PATH: target

jobs:
  rust:
    name: Windows checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup component add clippy rustfmt --toolchain $env:RUST_VERSION
          rustup default $env:RUST_VERSION

      - name: Restore GitHub target cache
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: windows-target-debug-${{ env.TARGET }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**/*.rs', 'src/**/*.wgsl', 'assets/shaders/**/*.wgsl') }}
          restore-keys: |
            windows-target-debug-${{ env.TARGET }}-rust-${{ env.RUST_VERSION }}-

      - name: Cache Cargo registry and git sources
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Lookup GitHub target cache before save
        id: target-cache-before-save
        if: success() && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: ${{ steps.target-cache.outputs.cache-primary-key }}
          lookup-only: true

      - name: Save GitHub target cache
        if: success() && steps.target-cache.outputs.cache-hit != 'true' && steps.target-cache-before-save.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TARGET_CACHE_PATH }}
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  context-menu-tint-gpu-qa:
    name: Context menu tint GPU QA
    if: github.event.pull_request.number == 153
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Force continuous hidden-window QA ticks
        shell: pwsh
        run: |
          $path = '.\src\app\handler.rs'
          $content = Get-Content $path -Raw
          $old = @'
          if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
'@
          $new = @'
          if self.qa_enabled() {
              // Temporary visual-QA override: Windows can coalesce WaitUntil
              // wakeups for a hidden window, so poll for this short scenario.
              event_loop.set_control_flow(ControlFlow::Poll);
          } else if let Some(deadline) = self.qa_next_deadline() {
              event_loop.set_control_flow(ControlFlow::WaitUntil(deadline.max(now)));
          } else {
'@
          if (-not $content.Contains($old)) {
            throw 'QA control-flow anchor was not found'
          }
          $content = $content.Replace($old, $new)
          Set-Content $path $content -NoNewline

      - name: Build debug launcher
        run: cargo build --locked

      - name: Run GPU QA and collect manifest
        id: qa
        shell: pwsh
        run: |
          $env:LAUNCHPAD_ALLOW_SCREENSHOT = '1'
          $env:LAUNCHPAD_QA_SCENARIO = (Resolve-Path .\qa\context_menu_tint.json).Path

          $process = Start-Process -FilePath .\target\debug\launchpad-windows.exe -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'GPU QA scenario timed out after 30 seconds'
          }
          if ($process.ExitCode -ne 0) {
            throw "GPU QA scenario exited with code $($process.ExitCode)"
          }

          $runDir = Get-ChildItem .\target\qa-sequences -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runDir) {
            throw 'GPU QA did not create an output directory'
          }

          $artifactDir = '.\target\qa-artifact\context-menu-tint'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $runDir.FullName '*') $artifactDir -Recurse -Force

          $manifestPath = Join-Path $runDir.FullName 'manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $openFrames = @($manifest.frames | Where-Object {
            $_.context_menu_active -eq $true -and $_.context_menu_phase -eq 'Open'
          })
          "open_frame_count=$($openFrames.Count)" >> $env:GITHUB_OUTPUT
          if ($openFrames.Count -gt 0) {
            $selected = $openFrames | Select-Object -Last 1
            $selectedPath = Join-Path $runDir.FullName $selected.file
            New-Item -ItemType Directory -Force -Path .\docs\qa | Out-Null
            Copy-Item $selectedPath .\docs\qa\context-menu-tint.png -Force
            "selected_frame=$($selected.file)" >> $env:GITHUB_OUTPUT
          }

      - name: Upload complete GPU QA sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-tint-visual-qa-final
          path: target/qa-artifact/context-menu-tint
          if-no-files-found: error

      - name: Require an open context menu frame
        shell: pwsh
        run: |
          if ('${{ steps.qa.outputs.open_frame_count }}' -eq '0') {
            throw 'GPU QA captured no frame with context_menu_active=true and phase=Open'
          }
          if (-not (Test-Path .\docs\qa\context-menu-tint.png)) {
            throw 'Selected context menu screenshot was not produced'
          }

      - name: Commit verified screenshot and restore CI
        shell: pwsh
        run: |
          git restore src/app/handler.rs
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-ci.yml docs/qa/context-menu-tint.png
          git rm .github/workflows/context-menu-tint-visual-qa.yml
          git rm .github/workflows/context-menu-tint-visual-qa-poll.yml
          git rm qa/context_menu_tint_qa.trigger
          git commit -m 'Capture verified context menu tint GPU QA'
          git push origin HEAD:agent/fix-glass-surface-tint

  macos:
    name: macOS checks
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup component add clippy --toolchain "$RUST_VERSION"
          rustup default "$RUST_VERSION"

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked
