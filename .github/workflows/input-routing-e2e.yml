name: Native input routing E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: input-routing-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0
  LAUNCHPAD_INPUT_ROUTING_TRACE: 1

jobs:
  windows:
    name: Windows native input routing
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - uses: Swatinem/rust-cache@v2

      - name: Build product and native harness
        run: cargo build --locked --bins

      - name: Validate independent input generator and probe
        run: .\target\debug\input_routing_scenarios.exe

      - name: Run product routing scenarios
        run: .\target\debug\input_routing_scenarios.exe --product

      - name: Verify scrolling in headful Microsoft Edge
        shell: pwsh
        run: |
          $edgeKey = Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe' -ErrorAction SilentlyContinue
          $edge = if ($edgeKey) { $edgeKey.GetValue('') } else { $null }
          if (-not $edge) {
            $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path -LiteralPath $edge -PathType Leaf)) {
            throw "Microsoft Edge executable not found: $edge"
          }
          $env:LAUNCHPAD_EDGE_EXE = $edge
          .\target\debug\input_routing_scenarios.exe --browser-compat

  macos:
    name: macOS native input routing
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2

      - name: Build product and native harness
        run: cargo build --locked --bins

      - name: Detect generator input permission
        id: macos_permissions
        shell: bash
        run: |
          if target/debug/input_routing_scenarios --permission-status; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate independent input generator and semantic AppKit probe
        if: steps.macos_permissions.outputs.full == 'true'
        run: target/debug/input_routing_scenarios

      - name: Run semantic product routing scenarios
        if: steps.macos_permissions.outputs.full == 'true'
        run: target/debug/input_routing_scenarios --product

      - name: Validate hosted-runner permission boundary
        if: steps.macos_permissions.outputs.full != 'true'
        run: target/debug/input_routing_scenarios --permission-denied-contract

      - name: Report macOS native E2E scope
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.macos_permissions.outputs.full }}" == "true" ]]; then
            echo "### macOS native input routing" >> "$GITHUB_STEP_SUMMARY"
            echo "Full semantic AppKit receiver E2E ran. The generator had post-event approval, and each Launchpad child reported its own Input Monitoring and Accessibility preflight as granted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### macOS native input routing" >> "$GITHUB_STEP_SUMMARY"
            echo "Hosted runner lacks generator post-event approval. Full product delivery was not run or reported as passed; only the explicit permission boundary was validated." >> "$GITHUB_STEP_SUMMARY"
          fi
