name: macOS Icon Compatibility

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/icons/**
      - src/platform/macos/**
      - examples/macos_icon_capture.rs
      - examples/macos_icon_compare.rs
      - .github/workflows/macos-icon-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: macos-icon-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0

jobs:
  capture:
    name: Capture icons (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Capture production icon path
        run: |
          cargo run --locked --example macos_icon_capture -- \
            --out "target/macos-icon-capture"

      - name: Upload capture fixture
        uses: actions/upload-artifact@v4
        with:
          name: macos-icon-capture-${{ matrix.os }}
          path: target/macos-icon-capture
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare macOS captures
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS 14 capture
        uses: actions/download-artifact@v4
        with:
          name: macos-icon-capture-macos-14
          path: target/macos-captures/macos-14

      - name: Download macOS 15 capture
        uses: actions/download-artifact@v4
        with:
          name: macos-icon-capture-macos-15
          path: target/macos-captures/macos-15

      - name: Download macOS 26 capture
        uses: actions/download-artifact@v4
        with:
          name: macos-icon-capture-macos-26
          path: target/macos-captures/macos-26

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Compare source and normalized images
        run: |
          cargo run --locked --example macos_icon_compare -- \
            --root target/macos-captures \
            --baseline macos-14 \
            --report target/macos-captures/compatibility-report.md \
            --preview target/macos-captures/compatibility-preview.png \
            --shape-preview target/macos-captures/compatibility-shape-preview.png

      - name: Add comparison to job summary
        run: cat target/macos-captures/compatibility-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: macos-icon-compatibility-report
          path: |
            target/macos-captures/compatibility-report.md
            target/macos-captures/compatibility-report.json
            target/macos-captures/compatibility-preview-*.png
            target/macos-captures/compatibility-shape-preview-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Comment comparison on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_JSON: target/macos-captures/compatibility-report.json
          MARKER: '<!-- macos-icon-compatibility-report -->'
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, 'utf8'));
            const { owner, repo } = context.repo;
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });

            const artifactLink = (name, label = name) => {
              const artifact = artifacts.artifacts.find((item) => item.name === name);
              if (!artifact) return `未取得: ${label}`;
              const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              return `[${label}](${url})`;
            };

            const statusFor = (comparison) => {
              const source = comparison.source.rgba_bytes_equal;
              const normalized = comparison.normalized.rgba_bytes_equal;
              if (source && normalized) return '✅ RGBA一致';
              const sourceDiff = `${comparison.source.changed_pixels}/${comparison.source.total_pixels}`;
              const normalizedDiff = `${comparison.normalized.changed_pixels}/${comparison.normalized.total_pixels}`;
              return `⚠️ 差分あり（取得 ${sourceDiff} / 正規化 ${normalizedDiff}）`;
            };

            const formatBox = (box) => {
              if (!box) return 'なし';
              return `${box.width}×${box.height}@(${box.min_x},${box.min_y})`;
            };

            const shapeRow = (comparison) => {
              const source = comparison.source.shape;
              const normalized = comparison.normalized.shape;
              const sourceText = source
                ? `外縁 ${formatBox(source.baseline.bbox_alpha_ge_11)} → ${formatBox(source.candidate.bbox_alpha_ge_11)}<br>本体 ${formatBox(source.baseline.bbox_alpha_ge_128)} → ${formatBox(source.candidate.bbox_alpha_ge_128)}<br>輪郭差 ${source.mask_changed_pixels_alpha_ge_11}/${comparison.source.total_pixels}`
                : '比較不可';
              const normalizedText = normalized
                ? `外縁 ${formatBox(normalized.baseline.bbox_alpha_ge_11)} → ${formatBox(normalized.candidate.bbox_alpha_ge_11)}<br>本体 ${formatBox(normalized.baseline.bbox_alpha_ge_128)} → ${formatBox(normalized.candidate.bbox_alpha_ge_128)}<br>輪郭差 ${normalized.mask_changed_pixels_alpha_ge_11}/${comparison.normalized.total_pixels}`
                : '比較不可';
              return `| ${comparison.app} | ${comparison.candidate_os} | ${sourceText} | ${normalizedText} |`;
            };

            const rows = report.map((comparison) => [
              `| ${comparison.app} | ${comparison.candidate_os} | ${statusFor(comparison)} |`,
            ].join(''));

            const body = [
              process.env.MARKER,
              '## macOSアイコン互換性検証',
              '',
              'macOS 14を基準に、同じアプリをmacOS 15・26で取得して比較しました。',
              '',
              '| アプリ | 比較対象 | 結果 |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '### 外形比較（アルファ形状）',
              '',
              '`外縁` は alpha ≥ 11、`本体` は alpha ≥ 128 の外接矩形です。形式は `幅×高さ@(x,y)` で、`→` の左がmacOS 14、右が比較対象OSです。`輪郭差` は同じ閾値のアルファマスクで所属が変わったピクセル数です。',
              '',
              '| アプリ | 比較対象 | 取得直後 | 正規化後 |',
              '| --- | --- | --- | --- |',
              ...report.map(shapeRow),
              '',
              '判定はPNGファイルではなく、展開後のRGBA画素を基準にしています。',
              'RGBA差分と外形差分は失敗ではなく、macOS側のアイコン表示変更を確認するための情報です。',
              '',
              '### 結果ファイル',
              '',
              `- ${artifactLink('macos-icon-compatibility-report', '比較レポート（Markdown / JSON / コンタクトシート）')}`,
              `- ${artifactLink('macos-icon-compatibility-report', '外形比較画像（Artifact内の compatibility-shape-preview-<app>.png）')}`,
              `- ${artifactLink('macos-icon-capture-macos-14', 'macOS 14の取得画像')}`,
              `- ${artifactLink('macos-icon-capture-macos-15', 'macOS 15の取得画像')}`,
              `- ${artifactLink('macos-icon-capture-macos-26', 'macOS 26の取得画像')}`,
              '',
              '画像は各Artifactを開くと、`source.png`（取得直後）と`normalized.png`（正規化後）を確認できます。`compatibility-preview-<app>.png` はアプリ別カラー比較、`compatibility-shape-preview-<app>.png` はアプリ別外形比較です。どちらも「macOS 14 / macOS 15 / macOS 26」の3列で、画像内にアプリ名・OS名・行の意味を表示しています。',
              '',
              `[Workflow実行結果](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(process.env.MARKER)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
