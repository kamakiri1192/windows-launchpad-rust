name: Apply context menu ordering fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - name: Move context-menu glass after modal content
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/renderer/frame.rs')
          text = path.read_text(encoding='utf-8')

          start_marker = '        // Context-menu Liquid Glass surface'
          end_marker = '        // Generic fixed modal content'
          insert_marker = '        // Context-menu content pass: tiles (opaque background), ink (icons),'

          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('could not locate current context-menu glass block')
          text = text[:start] + text[end:]

          insert_at = text.find(insert_marker)
          if insert_at < 0:
              raise SystemExit('could not locate context-menu content pass')

          moved = (
              '        // Context-menu glass must sample the complete modal scene. Folder child\n'
              '        // icons are modal content; rendering this pass before them lets those\n'
              '        // icons overwrite the tint and appear to punch through the menu.\n'
              '        let profile_scope = self\n'
              '            .gpu_profiler\n'
              '            .begin("context_menu_liquid_glass", &mut encoder);\n'
              '        self.liquid_glass\n'
              '            .render_context_menu_glass(&self.queue, &mut encoder, &view);\n'
              '        self.gpu_profiler.end(&mut encoder, profile_scope);\n\n'
          )
          path.write_text(text[:insert_at] + moved + text[insert_at:], encoding='utf-8')

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/frame.rs
          git commit -m 'Fix context menu glass ordering over folder icons'
          git push origin HEAD:agent/fix-glass-surface-tint
