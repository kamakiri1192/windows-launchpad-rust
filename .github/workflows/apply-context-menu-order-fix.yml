name: Apply context menu ordering fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - name: Move context-menu glass after modal content
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/renderer/frame.rs')
          text = path.read_text(encoding='utf-8')

          old = '''        // Context-menu Liquid Glass surface, isolated from the modal lane so it
          // never smooth-unions with an open folder panel.
          let profile_scope = self
              .gpu_profiler
              .begin("context_menu_liquid_glass", &mut encoder);
          self.liquid_glass
              .render_context_menu_glass(&self.queue, &mut encoder, &view);
          self.gpu_profiler.end(&mut encoder, profile_scope);

          '''
          if text.count(old) != 1:
              raise SystemExit('expected context-menu glass block exactly once')
          text = text.replace(old, '', 1)

          marker = '''        // Context-menu content pass: tiles (opaque background), ink (icons),
          // and text (labels). Drawn after modal content so the menu sits above
          '''
          if text.count(marker) != 1:
              raise SystemExit('expected context-menu content marker exactly once')

          moved = '''        // Context-menu glass must sample the complete modal scene. Folder child
          // icons are modal content; rendering this pass before them lets those
          // icons overwrite the tint and appear to punch through the menu.
          let profile_scope = self
              .gpu_profiler
              .begin("context_menu_liquid_glass", &mut encoder);
          self.liquid_glass
              .render_context_menu_glass(&self.queue, &mut encoder, &view);
          self.gpu_profiler.end(&mut encoder, profile_scope);

          '''
          path.write_text(text.replace(marker, moved + marker, 1), encoding='utf-8')

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer/frame.rs
          git commit -m 'Fix context menu glass ordering over folder icons'
          git push origin HEAD:agent/fix-glass-surface-tint
