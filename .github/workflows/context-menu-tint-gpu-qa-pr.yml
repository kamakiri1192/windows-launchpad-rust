name: Context menu tint GPU QA (PR)

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  context-menu-tint-gpu-qa:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glass-surface-tint
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply context menu tint and QA fixture
        shell: pwsh
        run: python qa/apply_context_menu_tint_qa.py

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Test
        shell: pwsh
        run: cargo test --all-targets --locked

      - name: Build release
        shell: pwsh
        run: cargo build --release --locked

      - name: Run context menu GPU QA
        id: qa
        shell: pwsh
        run: |
          $env:LAUNCHPAD_ALLOW_SCREENSHOT = '1'
          $env:LAUNCHPAD_QA_SCENARIO = (Resolve-Path .\qa\context_menu_tint.json).Path
          & .\target\release\launchpad-windows.exe
          if ($LASTEXITCODE -ne 0) {
            throw "GPU QA scenario exited with code $LASTEXITCODE"
          }

          $runDir = Get-ChildItem .\target\qa-sequences -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runDir) {
            throw 'GPU QA did not create an output directory'
          }
          $frame = Get-ChildItem $runDir.FullName -Filter 'frame_*.png' |
            Sort-Object Name |
            Select-Object -Last 1
          if (-not $frame) {
            throw 'GPU QA did not produce a PNG frame'
          }

          New-Item -ItemType Directory -Force -Path .\docs\qa | Out-Null
          Copy-Item $frame.FullName .\docs\qa\context-menu-tint.png -Force
          "run_dir=$($runDir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload full GPU QA sequence
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-tint-gpu-qa
          path: |
            ${{ steps.qa.outputs.run_dir }}
            docs/qa/context-menu-tint.png
          if-no-files-found: error

      - name: Commit implementation and screenshot
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/layout/context_menu.rs qa/context_menu_tint.json docs/qa/context-menu-tint.png
          git commit -m 'Apply context menu glass tint and add GPU QA'
          git push origin HEAD:agent/fix-glass-surface-tint
