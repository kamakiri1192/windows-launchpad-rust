name: Debug cargo-warloc output

on:
  pull_request:
    paths:
      - .github/workflows/debug-warloc-output.yml

permissions:
  contents: read

jobs:
  export-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-warloc
        run: cargo install cargo-warloc --version 0.1.1 --locked --quiet
      - name: Generate JSON output
        run: cargo warloc -o json > "$RUNNER_TEMP/warloc.json"
      - name: Upload JSON output
        uses: actions/upload-artifact@v4
        with:
          name: warloc-json
          path: ${{ runner.temp }}/warloc.json
