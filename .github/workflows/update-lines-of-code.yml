name: Update Rust code statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - assets/lines-of-code.svg
      - docs/CODE_STATS.md
  pull_request:
    paths:
      - "**/*.rs"
      - .github/workflows/update-lines-of-code.yml
      - README.md
      - assets/lines-of-code.svg
      - docs/CODE_STATS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-code-statistics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-statistics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-warloc
        run: cargo install cargo-warloc --version 0.1.1 --locked

      - name: Count Rust source lines
        run: cargo warloc -o json > "$RUNNER_TEMP/warloc.json"

      - name: Generate badge and detailed statistics
        env:
          WARLOC_JSON: ${{ runner.temp }}/warloc.json
        run: |
          python3 <<'PY'
          import html
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["WARLOC_JSON"])
          data = json.loads(source.read_text())

          def normalize(value):
              return re.sub(r"[^a-z0-9]", "", str(value).lower())

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return value
              if isinstance(value, float) and value.is_integer():
                  return int(value)
              if isinstance(value, str):
                  try:
                      return int(value.replace(",", ""))
                  except ValueError:
                      return None
              return None

          metric_aliases = {
              "code": {"code"},
              "blank": {"blank", "blanks", "empty", "emptylines"},
              "docs": {
                  "docs",
                  "doc",
                  "doccomments",
                  "documentation",
                  "documentationcomments",
              },
              "comments": {"comment", "comments", "regularcomments"},
          }
          category_aliases = {
              "main": "Main",
              "production": "Main",
              "tests": "Tests",
              "test": "Tests",
              "examples": "Examples",
              "example": "Examples",
          }

          def metrics_from(mapping):
              if not isinstance(mapping, dict):
                  return None
              normalized = {normalize(key): value for key, value in mapping.items()}
              result = {}
              for metric, aliases in metric_aliases.items():
                  value = None
                  for alias in aliases:
                      if alias in normalized:
                          value = as_int(normalized[alias])
                          break
                  result[metric] = 0 if value is None else value
              return result if any(result.values()) or "code" in normalized else None

          rows = {}

          def save(label, mapping):
              category = category_aliases.get(normalize(label))
              metrics = metrics_from(mapping)
              if category and metrics is not None:
                  rows[category] = metrics

          def walk(node, parent_label=None):
              if isinstance(node, dict):
                  if parent_label is not None:
                      save(parent_label, node)

                  for label_key in ("type", "kind", "category", "name"):
                      for key, value in node.items():
                          if normalize(key) == label_key and isinstance(value, str):
                              save(value, node)

                  for key, value in node.items():
                      save(key, value)
                      walk(value, key)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, parent_label)

          walk(data)

          missing = [category for category in ("Main", "Tests") if category not in rows]
          if missing:
              print(json.dumps(data, indent=2))
              raise SystemExit(
                  "Could not find cargo-warloc aggregate rows: " + ", ".join(missing)
              )

          rows.setdefault("Examples", {metric: 0 for metric in metric_aliases})

          def total(row):
              return sum(row[metric] for metric in ("code", "blank", "docs", "comments"))

          def compact(value):
              if value >= 1_000_000:
                  return f"{value / 1_000_000:.1f}M"
              if value >= 1_000:
                  return f"{value / 1_000:.1f}k"
              return str(value)

          main_value = compact(rows["Main"]["code"])
          tests_value = compact(rows["Tests"]["code"])
          badge_value = f"main {main_value} · tests {tests_value}"
          escaped_badge_value = html.escape(badge_value)

          width = 292
          label_width = 68
          value_width = width - label_width
          label_center = label_width / 2
          value_center = label_width + value_width / 2

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="20" role="img" aria-label="Rust LOC: {escaped_badge_value}">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="{width}" height="20" rx="3"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="{label_width}" height="20" fill="#555"/>
              <rect x="{label_width}" width="{value_width}" height="20" fill="#007ec6"/>
              <rect width="{width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text aria-hidden="true" x="{label_center}" y="15" fill="#010101" fill-opacity=".3">Rust LOC</text>
              <text x="{label_center}" y="14">Rust LOC</text>
              <text aria-hidden="true" x="{value_center}" y="15" fill="#010101" fill-opacity=".3">{escaped_badge_value}</text>
              <text x="{value_center}" y="14">{escaped_badge_value}</text>
            </g>
          </svg>
          '''
          Path("assets/lines-of-code.svg").write_text(svg)

          categories = ("Main", "Tests", "Examples")
          totals = {
              metric: sum(rows[category][metric] for category in categories)
              for metric in ("code", "blank", "docs", "comments")
          }

          lines = [
              "# コード統計",
              "",
              "Rustソースコードを`cargo-warloc` 0.1.1で集計しています。",
              "製品コード、テストコード、examplesを分離し、正確な行数を掲載します。",
              "",
              "| 区分 | コード | 空行 | ドキュメントコメント | コメント | 合計 |",
              "| --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          for category in categories:
              row = rows[category]
              lines.append(
                  f"| {category} | {row['code']:,} | {row['blank']:,} | "
                  f"{row['docs']:,} | {row['comments']:,} | {total(row):,} |"
              )
          lines.append(
              f"| **Total** | **{totals['code']:,}** | **{totals['blank']:,}** | "
              f"**{totals['docs']:,}** | **{totals['comments']:,}** | "
              f"**{total(totals):,}** |"
          )
          lines.extend(
              [
                  "",
                  "`#[cfg(test)]`および`#[test]`内のコードはTestsとして集計されます。",
                  "`.gitignore`で除外されたファイルは集計対象外です。",
                  "",
                  "このファイルとREADMEのバッジはGitHub Actionsによって自動更新されます。",
                  "",
              ]
          )
          Path("docs/CODE_STATS.md").write_text("\n".join(lines))

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          badge = "[![Rust LOC](assets/lines-of-code.svg)](docs/CODE_STATS.md)"
          pattern = re.compile(
              r"^\[!\[(?:Lines of Code|Rust LOC)\]\(assets/lines-of-code\.svg\)\]\([^\n]+\)$",
              re.MULTILINE,
          )
          updated, replacements = pattern.subn(badge, readme, count=1)
          if replacements != 1:
              raise SystemExit("Could not find the existing lines-of-code badge in README.md")
          readme_path.write_text(updated)
          PY

      - name: Verify generated statistics
        if: github.event_name == 'pull_request'
        run: |
          test -s assets/lines-of-code.svg
          test -s docs/CODE_STATS.md
          grep -Fq '[![Rust LOC](assets/lines-of-code.svg)](docs/CODE_STATS.md)' README.md
          git diff --check

      - name: Commit updated statistics
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md assets/lines-of-code.svg docs/CODE_STATS.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/lines-of-code.svg docs/CODE_STATS.md
          git commit -m "chore: update Rust code statistics [skip ci]"
          git push
